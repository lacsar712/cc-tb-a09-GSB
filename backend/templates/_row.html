<tr>
  <td>{{ row.lot }}</td>
  <td>
    {% for term in row.selected_terms %}<span class="term-tag">{{ term }}</span>{% endfor %}
  </td>
  <td>{{ row.score }}</td>
  <td class="{% if row.verdict == '通过' %}pass{% else %}fail{% endif %}">{{ row.verdict }}</td>
  <td>{{ row.note }}</td>
  <td><a href="{{ url_for('detail', cupping_id=row.id) }}">详情</a></td>
</tr>
